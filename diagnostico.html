<meta charset="utf-8" />
<title>Diagnóstico do Espaço Rafah</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="styles.css?v=6" />
<style>
  body{font:16px system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#fff;color:#111;}
  h1{font-size:20px;margin:0 0 14px;}
  table{border-collapse:collapse;width:100%;max-width:560px;font-size:15px;}
  td{padding:8px 10px;border-bottom:1px solid #ddd;vertical-align:top;}
  td:first-child{color:#666;white-space:nowrap;}
  b{font-size:17px;}
  .ok{color:#0a7c2f;font-weight:700;} .ruim{color:#c01818;font-weight:700;}
  .amostra{margin-top:24px;}
  .gallery{max-width:560px;}
</style>
<h1>Diagnóstico · mande um print desta tela</h1>
<table id="r"></table>
<div class="amostra">
  <div class="gallery">
    <div class="gtile"><div class="slot"><img id="amostra" src="gal-coracao.jpg" alt="teste" /></div></div>
  </div>
</div>
<script>
(function(){
  function linha(k,v,classe){
    var tr=document.createElement("tr");
    tr.innerHTML="<td>"+k+"</td><td><b"+(classe?' class="'+classe+'"':"")+">"+v+"</b></td>";
    document.getElementById("r").appendChild(tr);
  }
  setTimeout(function(){
    var css=document.querySelector('link[href*="styles.css"]').getAttribute("href");
    var t=document.querySelector(".gtile"), s=document.querySelector(".slot"), i=document.getElementById("amostra");
    var rt=t.getBoundingClientRect(), rs=s.getBoundingClientRect(), ri=i.getBoundingClientRect();
    var carregou=i.complete && i.naturalWidth>0;
    linha("Versão do CSS", css, css.indexOf("v=6")>=0?"ok":"ruim");
    linha("Navegador", navigator.userAgent.slice(0,70));
    linha("Altura do quadro", Math.round(rt.height)+" px", rt.height>50?"ok":"ruim");
    linha("Altura da moldura", Math.round(rs.height)+" px", rs.height>50?"ok":"ruim");
    linha("Altura da imagem", Math.round(ri.height)+" px", ri.height>50?"ok":"ruim");
    linha("Foto baixou?", carregou?("sim, "+i.naturalWidth+"x"+i.naturalHeight):"NAO", carregou?"ok":"ruim");
    linha("Posição da imagem", getComputedStyle(i).position);
    linha("Suporta aspect-ratio?", (CSS.supports&&CSS.supports("aspect-ratio","1/1"))?"sim":"NAO");
    linha("Suporta inset?", (CSS.supports&&CSS.supports("inset","0"))?"sim":"NAO");
  },1200);
})();
</script>
